services:
  db:
    image: postgres:17
    restart: always
    env_file:
      - .env
    ports:
      - "5433:5432"
    volumes:
      - postgres-db-vinci-challenge:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build: ./server
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env

  client:
    build: ./client
    ports:
      - "5173:5173"

volumes:
  postgres-db-vinci-challenge:
